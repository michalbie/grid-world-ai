<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <template id="state-template">
        <div class="state">
            <p>State ${index + 1}</p>
            <div>
                <button class="load-state">Load</button>
                <button class="remove-state">Remove</button>
            </div>
        </div>
    </template>

    <div id="game-container">
        <div class="slidecontainer">
            <label for="myRange">Exploration rate: </label>
            <input type="range" min="0.00" max="1.00" value="0.7" step="0.1" class="slider" id="exploration-slider">
            <p id="exploration-value">Value: 0.7</p>
        </div>
        <canvas id="game-canvas" width="500" height="500"></canvas>
        <div id="controls-container">
            <button id="start-button">Start</button>
            <button id="stop-button">Stop</button>
            <button id="reset-button">Reset</button>
            <button id="reset-table-button">Reset table</button>
            <button id="generate-maze">Generate new maze</button>
            <button id="save-state">Save simulation state</button>
        </div>
        <div id="states-container">
            <h2>Saved states</h2>
            <div id="states-list"></div>
        </div>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
